<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12ADA0"/>
      <stop offset="65%" stop-color="#0E8C82"/>
      <stop offset="65.01%" stop-color="#C43D3D"/>
      <stop offset="100%" stop-color="#A32E2E"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12ADA0"/>
      <stop offset="100%" stop-color="#C43D3D"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M 176,88 L 336,88 L 336,190 C 336,252 304,288 256,322 C 208,288 176,252 176,190 Z"
        fill="url(#shieldGrad)"/>

  <!-- Inner icon: a fast in-memory key/data diamond — this store is Redis backed -->
  <polygon points="256,130 306,187 256,244 206,187" fill="#FFFFFF"/>
  <polygon points="256,152 284,187 256,222 228,187" fill="#0E8C82" opacity="0.55"/>

  <!-- Wordmark -->
  <text x="256" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="58" letter-spacing="4" fill="#1A1A1A">IDEMPOTENCYKIT</text>

  <!-- Divider -->
  <rect x="146" y="402" width="220" height="4" fill="url(#lineGrad)"/>

  <!-- Tagline -->
  <text x="256" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="1.5" fill="#6B7280">SHARED IDEMPOTENCY STORE</text>
  <text x="256" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="1.5" fill="#6B7280">FOR REDIS</text>
</svg>
