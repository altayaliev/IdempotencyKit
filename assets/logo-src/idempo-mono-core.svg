<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>

  <!-- "i" : dot + bar -->
  <circle cx="150" cy="128" r="21" fill="#1B5E3A"/>
  <rect x="131" y="163" width="38" height="237" fill="#1B5E3A"/>

  <!-- "D" stem -->
  <rect x="204" y="106" width="42" height="294" fill="#1B5E3A"/>

  <!-- "D" bowl, tapering into a shield point below the stem -->
  <path d="M 246,106
           C 330,106 368,158 368,224
           C 368,296 332,344 296,378
           L 286,470
           L 232,378
           C 214,350 204,316 204,290
           L 204,106
           Z" fill="#1B5E3A"/>

  <!-- Inner icon (same color, negative-space/cutout): retry-loop converging into a checkmark -->
  <path d="M 322,244 A 46 46 0 1 1 282,198" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
  <polygon points="294,198 282,206 282,190" fill="#FFFFFF"/>
  <polyline points="258,248 276,266 308,230" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small, secondary wordmark -->
  <text x="256" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="22" letter-spacing="5" fill="#1B5E3A">IDEMPO</text>
</svg>
